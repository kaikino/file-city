[package]
name = "file-city"
version = "0.1.0"
edition = "2021"
description = "First-person 3D filesystem explorer: your files as an interactive city"

[dependencies]
bevy = { version = "0.19", features = ["mp3", "wav", "flac", "vorbis"] }
avian3d = "0.7"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
rand = { version = "0.9", features = ["small_rng"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.9"
serde_json = "1.0.151"
lopdf = "0.44.0"
resvg = "0.48.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[features]
# Fast iteration builds: cargo run --features dev
dev = ["bevy/dynamic_linking"]

# Reasonable runtime perf in dev, heavy optimization for dependencies (compiled once)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
